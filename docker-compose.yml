services:
  bot:
    build: .
    image: cinecast-bot:latest
    container_name: cinecast
    restart: unless-stopped
    # Локально удобно подхватить .env; на хостинге задайте переменные
    # окружения в панели и эту строку можно убрать.
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Куки для приватных видео (опционально):
      # - ./cookies.txt:/app/cookies.txt:ro
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
